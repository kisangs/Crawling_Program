# 태그(예: 20261028_Version)를 푸시하면 Windows에서 EXE를 빌드해 GitHub 릴리즈에 자동 업로드
name: Build EXE and Release

on:
  push:
    tags:
      - '*_Version'
  # Actions 탭에서 수동 실행 (릴리즈 없이 EXE만 빌드해서 테스트할 때)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: EXE 빌드
        run: pyinstaller --onefile --windowed --name Crawling_Program --hidden-import babel.numbers Crawling_Program.py

      # 수동 실행 시 Actions 실행 화면에서 EXE 다운로드 가능
      - uses: actions/upload-artifact@v4
        with:
          name: Crawling_Program
          path: dist/Crawling_Program.exe

      # 태그 푸시일 때만 릴리즈 생성 (프로그램 자동 업데이트가 첫 번째 파일을 받으므로 EXE 하나만 올림)
      - name: GitHub 릴리즈 생성
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Crawling_Program.exe
          generate_release_notes: true
